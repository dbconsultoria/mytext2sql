# 30 perguntas de avaliacao. Todo sql_gabarito foi executado contra o banco
# (mysql/x90_views.sql) antes de ser salvo aqui. Perguntas com tag "recusa"
# nao tem sql_gabarito: o esperado e pode_responder=false no pipeline.

- pergunta: "Qual foi o faturamento total da loja?"
  sql_gabarito: "SELECT SUM(valor_total_item) AS faturamento FROM vw_vendas"
  nivel: facil
  tags: [agregacao]

- pergunta: "Quantos pedidos foram feitos no total?"
  sql_gabarito: "SELECT COUNT(DISTINCT pedido_id) AS numero_pedidos FROM vw_vendas"
  nivel: facil
  tags: [agregacao]

- pergunta: "Qual a quantidade total de itens vendidos?"
  sql_gabarito: "SELECT SUM(quantidade) AS quantidade_vendida FROM vw_vendas"
  nivel: facil
  tags: [agregacao]

- pergunta: "Qual foi o faturamento total em 2023?"
  sql_gabarito: "SELECT SUM(valor_total_item) AS faturamento FROM vw_vendas WHERE ano = 2023"
  nivel: facil
  tags: [agregacao]

- pergunta: "Qual foi o faturamento do ultimo mes?"
  sql_gabarito: >-
    SELECT SUM(v.valor_total_item) AS faturamento
    FROM vw_vendas v CROSS JOIN vw_referencia r
    WHERE v.ano_mes = DATE_FORMAT(r.data_referencia, '%Y-%m')
  nivel: medio
  tags: [data_relativa, agregacao]

- pergunta: "Qual foi o faturamento nos ultimos 12 meses?"
  sql_gabarito: >-
    SELECT SUM(v.valor_total_item) AS faturamento
    FROM vw_vendas v CROSS JOIN vw_referencia r
    WHERE v.data_pedido > DATE_SUB(r.data_referencia, INTERVAL 12 MONTH)
  nivel: medio
  tags: [data_relativa, agregacao]

- pergunta: "Quais os 3 clientes que mais gastaram?"
  sql_gabarito: >-
    SELECT cliente_nome, SUM(valor_total_item) AS faturamento
    FROM vw_vendas GROUP BY cliente_nome ORDER BY faturamento DESC LIMIT 3
  nivel: facil
  tags: [ranking]

