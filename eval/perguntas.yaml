- pergunta: "Compare o faturamento de celulares com o de tablets"
  sql_gabarito: >-
    SELECT categoria_nome, SUM(valor_total_item) AS faturamento FROM vw_vendas
    WHERE categoria_nome IN ('Cell Phones','Tablets')
    GROUP BY categoria_nome ORDER BY faturamento DESC LIMIT 100
  nivel: medio
  tags: [comparacao, traducao_categoria, agregacao]

- pergunta: "Para cada produto, qual a diferenca entre o preco de catalogo e o preco medio praticado?"
  sql_gabarito: >-
    SELECT produto_nome, preco_catalogo,
           ROUND(SUM(valor_total_item)/SUM(quantidade),2) AS preco_medio_praticado,
           ROUND(preco_catalogo - SUM(valor_total_item)/SUM(quantidade),2) AS diferenca
    FROM vw_vendas GROUP BY produto_nome, preco_catalogo ORDER BY diferenca DESC LIMIT 100
  nivel: dificil
  tags: [comparacao]

